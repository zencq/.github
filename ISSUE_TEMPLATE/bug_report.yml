name: Bug Report
description: An unexpected problem or behavior.
title: "[Bug]: "
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Give us a clear and concise description of the error. Also, include what you expected to happen and what did actually happen.
      placeholder: A bug happened!
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of the software are you running?
    validations:
      required: true

  - type: upload
    id: upload
    attributes:
      label: Upload additional data
      description: If applicable, logs, crash reports, and save files can be uploaded here. Please make sure to not upload any sensitive data. If you need to share something privately, get in touch with us through our Discord server.
    validations:
      required: false

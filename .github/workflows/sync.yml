name: Sync shared files

on:
  push:
    branches:
      - main
    paths:
      - ".editorconfig"
      - ".gitattributes"
      - ".github/workflows/**"
      - ".qlty/**"
      - "docs/README.md"
      - "instructions/**"
      - "scripts/update-indexes.sh"
  workflow_dispatch:
    inputs:
      replace-kept-files:
        description: Also replace the files that repositories keep as their own (replace false in the sync config)
        type: boolean
        default: false

# Queue runs instead of cancelling them, so a sync is never left half-done across repositories.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  # The layer indexes are generated, so a sync never ships one that misses a file or names a stale applyTo.
  indexes:
    name: Check Layer Indexes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Regenerate Indexes
        run: scripts/update-indexes.sh

      - name: Compare With Committed Indexes
        run: |
          if [ -n "$(git status --porcelain -- instructions)" ]; then
            git status --short -- instructions
            git diff -- instructions
            echo "::error::The layer indexes are out of date. Run scripts/update-indexes.sh and commit the result."
            exit 1
          fi

  sync:
    name: Sync
    needs: indexes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The cross-repository writes use the SYNC_TOKEN secret, not GITHUB_TOKEN, which only reaches this repository.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Replace Kept Files Too
        if: inputs.replace-kept-files
        env:
          CONFIG: .github/workflows/config/sync.yml
        run: |
          sed -i 's/replace: false/replace: true/' "$CONFIG"
          if grep -q 'replace: false' "$CONFIG"; then exit 1; fi

      - name: Sync Shared Files
        uses: N6REJ/repo-file-sync-action@f815829feca285fc2800ce183fbd6f59db85ca33 # v2026.10.10+0
        with:
          GH_PAT: ${{ secrets.SYNC_TOKEN }}
          IS_FINE_GRAINED: true
          CONFIG_PATH: .github/workflows/config/sync.yml
          COMMIT_PREFIX: "chore:"
          COMMIT_EACH_FILE: false
          BRANCH_PREFIX: sync/shared-instructions
          PR_LABELS: false
          PR_BODY: |
            Shared agent instructions and repository setup files (`.editorconfig`, `.gitattributes`, `.qlty/`) from [zencq/.github](https://github.com/zencq/.github).
            Don't edit these files here; change them in `zencq/.github`. Each layer's `README.md` lists its files, so a shared file added or removed needs no change here; only a layer added or removed needs one in the layer list of `AGENTS.md`.
